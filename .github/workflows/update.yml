name: Update PCR Data

on:
schedule:
- cron: "*/5 * * * *"
workflow_dispatch:

jobs:
update:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repo
    uses: actions/checkout@v3

  - name: Setup Python
    uses: actions/setup-python@v4
    with:
      python-version: '3.10'

  - name: Install dependencies
    run: pip install requests

  - name: Run script
    run: python script.py

  - name: Commit data
    run: |
      git config user.name "github-actions"
      git config user.email "actions@github.com"
      git add data.json
      git commit -m "update data" || echo "no change"
      git push
```
