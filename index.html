<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>NSE PCR Dashboard (Pro)</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    margin:0;
    font-family:Arial;
    background:#0f172a;
    color:white;
    text-align:center;
}

h1 {
    margin:20px;
}

.controls {
    margin-bottom:15px;
}

select, button {
    padding:10px;
    margin:5px;
    border:none;
    border-radius:6px;
}

.start { background:#16a34a; color:white; }
.stop { background:#dc2626; color:white; }

.status {
    margin:10px;
    font-weight:bold;
}

.cards {
    display:flex;
    justify-content:center;
    gap:20px;
    margin:20px;
}

.card {
    background:#1e293b;
    padding:20px;
    border-radius:10px;
    width:220px;
}

.card h3 {
    margin-bottom:10px;
}

.card p {
    font-size:22px;
    font-weight:bold;
}

.grid {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    padding:20px;
}

canvas {
    background:#1e293b;
    border-radius:10px;
    padding:10px;
}
</style>

</head>

<body>

<h1>📊 NSE PCR Dashboard (ATM ±8)</h1>

<div class="controls">
<select id="symbol">
    <option value="NIFTY">NIFTY</option>
    <option value="BANKNIFTY">BANKNIFTY</option>
</select>

<button class="start" onclick="start()">Start</button> <button class="stop" onclick="stop()">Stop</button>

</div>

<div class="status" id="status">Status: Stopped</div>

<div class="cards">
    <div class="card">
        <h3>OI PCR</h3>
        <p id="oiPcr">--</p>
    </div>
    <div class="card">
        <h3>Change OI PCR</h3>
        <p id="coiPcr">--</p>
    </div>
</div>

<div class="grid">
    <canvas id="oiChart"></canvas>
    <canvas id="coiChart"></canvas>
</div>

<script>

// 🔴 PUT YOUR WORKER URL HERE
https://purple-morning-a655.execution-docagram-cloudflare.workers.dev/;

let interval;
let labels = [];
let oiData = [];
let coiData = [];

function start() {
    document.getElementById("status").innerText = "Status: Running";
    fetchData();
    interval = setInterval(fetchData, 300000); // 5 min
}

function stop() {
    clearInterval(interval);
    document.getElementById("status").innerText = "Status: Stopped";
}

async function fetchData() {
    try {
        let symbol = document.getElementById("symbol").value;

        let res = await fetch(`${API_BASE}?symbol=${symbol}`);
        let json = await res.json();

        let data = json.records.data;
        let spot = json.records.underlyingValue;

        // Find ATM
        let atmObj = data.reduce((prev, curr) =>
            Math.abs(curr.strikePrice - spot) < Math.abs(prev.strikePrice - spot)
                ? curr
                : prev
        );

        let atm = atmObj.strikePrice;

        // Strike step logic
        let step = (symbol === "NIFTY") ? 50 : 100;

        // Filter ±8 strikes
        let strikes = data.filter(x =>
            x.strikePrice >= atm - (8 * step) &&
            x.strikePrice <= atm + (8 * step)
        );

        let peOI = 0, ceOI = 0;
        let peCOI = 0, ceCOI = 0;

        strikes.forEach(x => {
            if (x.CE && x.PE) {
                peOI += x.PE.openInterest;
                ceOI += x.CE.openInterest;

                peCOI += x.PE.changeinOpenInterest;
                ceCOI += x.CE.changeinOpenInterest;
            }
        });

        let oiPCR = ceOI ? (peOI / ceOI) : 0;
        let coiPCR = ceCOI ? (peCOI / ceCOI) : 0;

        oiPCR = oiPCR.toFixed(2);
        coiPCR = coiPCR.toFixed(2);

        document.getElementById("oiPcr").innerText = oiPCR;
        document.getElementById("coiPcr").innerText = coiPCR;

        let time = new Date().toLocaleTimeString();

        labels.push(time);
        oiData.push(oiPCR);
        coiData.push(coiPCR);

        chart1.update();
        chart2.update();

    } catch (err) {
        document.getElementById("status").innerText = "Error fetching data";
        console.error(err);
    }
}

// Charts
let chart1 = new Chart(document.getElementById("oiChart"), {
    type: "line",
    data: {
        labels: labels,
        datasets: [{
            label: "OI PCR",
            data: oiData
        }]
    }
});

let chart2 = new Chart(document.getElementById("coiChart"), {
    type: "line",
    data: {
        labels: labels,
        datasets: [{
            label: "Change OI PCR",
            data: coiData
        }]
    }
});

</script>

</body>
</html>
