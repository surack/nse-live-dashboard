<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>NSE PCR Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body { background:#0f172a; color:white; font-family:Arial; text-align:center; }
.card { background:#1e293b; padding:15px; border-radius:10px; width:200px; }
.top { display:flex; justify-content:center; gap:20px; margin:20px; }
.container { display:grid; grid-template-columns:1fr 1fr; gap:20px; padding:20px; }
button { padding:10px; margin:10px; border:none; border-radius:5px; cursor:pointer; }
.start { background:green; }
.stop { background:red; }
</style>

</head>

<body>

<h2>NSE PCR Dashboard (ATM ±8)</h2>

<select id="symbol">
<option value="NIFTY">NIFTY</option>
<option value="BANKNIFTY">BANKNIFTY</option>
</select>

<br>
<button class="start" onclick="start()">Start</button>
<button class="stop" onclick="stop()">Stop</button>

<p id="status">Stopped</p>

<div class="top">
<div class="card">
<h3>OI PCR</h3>
<p id="oiPcr">--</p>
</div>

<div class="card">
<h3>Change OI PCR</h3>
<p id="coiPcr">--</p>
</div>
</div>

<div class="container">
<canvas id="chart1"></canvas>
<canvas id="chart2"></canvas>
</div>

<script>

let interval;
let labels=[], oiData=[], coiData=[];

async function fetchData(){

let symbol=document.getElementById("symbol").value;

// NEW WORKING PROXY
let url=`https://corsproxy.io/?https://www.nseindia.com/api/option-chain-indices?symbol=${symbol}`;

let res=await fetch(url);
let json=await res.json();

let data=json.records.data;
let spot=json.records.underlyingValue;

// find ATM
let atm=data.reduce((a,b)=> Math.abs(b.strikePrice-spot)<Math.abs(a.strikePrice-spot)?b:a).strikePrice;

// ±8 strikes (dynamic step)
let step = symbol==="NIFTY"?50:100;

let strikes=data.filter(x=>x.strikePrice>=atm-8*step && x.strikePrice<=atm+8*step);

let peOI=0, ceOI=0, peCOI=0, ceCOI=0;

strikes.forEach(x=>{
if(x.CE && x.PE){
ceOI+=x.CE.openInterest;
peOI+=x.PE.openInterest;

ceCOI+=x.CE.changeinOpenInterest;
peCOI+=x.PE.changeinOpenInterest;
}
});

let oiPCR=(peOI/ceOI).toFixed(2);
let coiPCR=(peCOI/ceCOI).toFixed(2);

// update UI
document.getElementById("oiPcr").innerText=oiPCR;
document.getElementById("coiPcr").innerText=coiPCR;

let time=new Date().toLocaleTimeString();

labels.push(time);
oiData.push(oiPCR);
coiData.push(coiPCR);

chart1.update();
chart2.update();
}

function start(){
document.getElementById("status").innerText="Running";
fetchData();
interval=setInterval(fetchData,300000);
}

function stop(){
clearInterval(interval);
document.getElementById("status").innerText="Stopped";
}

let chart1=new Chart(document.getElementById("chart1"),{
type:"line",
data:{labels:labels,datasets:[{label:"OI PCR",data:oiData}]}
});

let chart2=new Chart(document.getElementById("chart2"),{
type:"line",
data:{labels:labels,datasets:[{label:"Change OI PCR",data:coiData}]}
});

</script>

</body>
</html>
