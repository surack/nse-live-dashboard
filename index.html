<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>NSE Pro PCR Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    background:#0f172a;
    color:white;
    font-family:Arial;
    text-align:center;
}
h1 { margin:20px; }

.top-cards {
    display:flex;
    justify-content:center;
    gap:20px;
    margin-bottom:20px;
}
.card {
    background:#1e293b;
    padding:15px;
    border-radius:10px;
    width:200px;
}
.container {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    padding:20px;
}
canvas {
    background:#1e293b;
    border-radius:10px;
    padding:10px;
}
button {
    padding:10px 20px;
    margin:10px;
    border:none;
    border-radius:5px;
    cursor:pointer;
}
.start { background:green; }
.stop { background:red; }
</style>

</head>

<body>

<h1>📊 NSE PCR Dashboard (ATM ±8)</h1>

<select id="index">
    <option value="NIFTY">NIFTY</option>
    <option value="BANKNIFTY">BANKNIFTY</option>
</select>

<br>

<button class="start" onclick="start()">Start</button> <button class="stop" onclick="stop()">Stop</button>

<p id="status">Stopped</p>

<div class="top-cards">
    <div class="card">
        <h3>OI PCR</h3>
        <p id="oiPcrValue">--</p>
    </div>
    <div class="card">
        <h3>Change OI PCR</h3>
        <p id="coiPcrValue">--</p>
    </div>
</div>

<div class="container">
    <canvas id="oiChart"></canvas>
    <canvas id="coiChart"></canvas>
</div>

<script>

let interval;
let labels = [];
let oiPCRData = [];
let coiPCRData = [];

function start(){
    document.getElementById("status").innerText="Running";
    fetchData();
    interval=setInterval(fetchData,300000);
}

function stop(){
    clearInterval(interval);
    document.getElementById("status").innerText="Stopped";
}

async function fetchData(){

    let symbol=document.getElementById("index").value;

    let url=`https://api.allorigins.win/raw?url=https://www.nseindia.com/api/option-chain-indices?symbol=${symbol}`;

    let res=await fetch(url);
    let json=await res.json();

    let data=json.records.data;
    let spot=json.records.underlyingValue;

    // find ATM
    let closest=data.reduce((prev,curr)=>{
        return Math.abs(curr.strikePrice-spot) < Math.abs(prev.strikePrice-spot) ? curr : prev;
    });

    let atm=closest.strikePrice;

    // filter ±8 strikes
    let strikes=data.filter(item=>{
        return item.strikePrice>=atm-8*100 && item.strikePrice<=atm+8*100;
    });

    let totalPE_OI=0;
    let totalCE_OI=0;
    let totalPE_COI=0;
    let totalCE_COI=0;

    for(let item of strikes){
        if(item.CE && item.PE){
            totalCE_OI+=item.CE.openInterest;
            totalPE_OI+=item.PE.openInterest;

            totalCE_COI+=item.CE.changeinOpenInterest;
            totalPE_COI+=item.PE.changeinOpenInterest;
        }
    }

    let oiPCR=(totalPE_OI/totalCE_OI).toFixed(2);
    let coiPCR=(totalPE_COI/totalCE_COI).toFixed(2);

    document.getElementById("oiPcrValue").innerText=oiPCR;
    document.getElementById("coiPcrValue").innerText=coiPCR;

    let time=new Date().toLocaleTimeString();

    labels.push(time);
    oiPCRData.push(oiPCR);
    coiPCRData.push(coiPCR);

    updateCharts();
}

function createChart(id,label,dataArr){
    return new Chart(document.getElementById(id),{
        type:'line',
        data:{
            labels:labels,
            datasets:[{
                label:label,
                data:dataArr
            }]
        }
    });
}

let chart1=createChart("oiChart","OI PCR",oiPCRData);
let chart2=createChart("coiChart","Change OI PCR",coiPCRData);

function updateCharts(){
    chart1.update();
    chart2.update();
}

</script>

</body>
</html>
